name: Voxel Craft WebGL test

on:
  workflow_dispatch:
  push:
    paths:
      - "voxel-craft-tools-v7-1.html"
      - ".github/workflows/webgl-test.yml"

permissions:
  contents: read

jobs:
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run gameplay regression tests with SwiftShader WebGL
        env:
          GAME_URL: https://gcgvovruoou-ai.github.io/voxel-test/voxel-craft-tools-v7-1.html
        run: |
          mkdir -p test-results
          node .github/scripts/voxel-regression.cjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: voxel-craft-webgl-test
          path: test-results/
          if-no-files-found: warn
